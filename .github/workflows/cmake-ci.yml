name: C++ CMake CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        if: hashFiles('CMakeLists.txt') != ''
        uses: lukka/get-cmake@latest

      - name: Configure
        if: hashFiles('CMakeLists.txt') != ''
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        if: hashFiles('CMakeLists.txt') != ''
        run: cmake --build build --parallel 2

      - name: Run tests
        if: hashFiles('CMakeLists.txt') != ''
        run: ctest --test-dir build --output-on-failure

      - name: Source-tree readiness check
        if: hashFiles('CMakeLists.txt') == ''
        run: |
          echo "::warning::No root CMakeLists.txt exists yet. The repository currently contains project PDFs and planning files only; commit the C++ source, CMakeLists.txt and GoogleTest targets to activate build/test steps."
